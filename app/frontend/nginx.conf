# Serves the built frontend and proxies /api to the backend, so the browser only talks to one address
# (no CORS needed: every request is same-origin).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx 1.27 doesn't know .mjs: the map's worker (maplibre-gl-worker-*.mjs) would be sent as
    # application/octet-stream, the browser refuses it, and the map shows pins but no tiles.
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }

    # Browsers must re-check index.html, so a redeploy shows up without a hard refresh.
    # The JS/CSS files have a hash in their name, so they can stay cached.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Docker's DNS: "backend" is looked up per request, so nginx starts even if the backend isn't up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        # $http_host keeps the port, so Spring's same-origin check also passes on localhost:5173.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # No X-Forwarded-Proto line: the demo platform sends https and nginx passes it on unchanged.
        proxy_read_timeout 55s;
    }

    # Client-side routes (/customer, /login...) fall back to index.html so a page refresh works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
