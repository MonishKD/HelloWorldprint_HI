# Serves the built frontend and proxies /api to the backend, so the browser only talks to one address
# (no CORS needed: every request is same-origin).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's DNS: "backend" is looked up per request, so nginx starts even if the backend isn't up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        # $http_host keeps the port, so Spring's same-origin check also passes on localhost:5173.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # No X-Forwarded-Proto line: the demo platform sends https and nginx passes it on unchanged.
        proxy_read_timeout 55s;
    }

    # Client-side routes (/customer, /login...) fall back to index.html so a page refresh works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
