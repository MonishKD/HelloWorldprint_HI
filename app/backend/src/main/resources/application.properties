spring.application.name=${DB_NAME}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.sql.init.schema-locations=classpath:schema/01-restaurants.sql,classpath:schema/02-menus.sql,classpath:schema/03-users.sql,classpath:schema/04-orders.sql,classpath:schema/05-command-log.sql

# Reads settings from the ROOT .env file (the same one docker-compose uses), so there is only one .env to fill in.
# "../../.env" means go up two folders from app/backend to the repo root. The file is "optional" so the app
# does not crash when it runs in Docker, where compose passes the settings in directly instead.
spring.config.import=optional:file:../../.env[.properties]

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

# The frontend's address, the only website allowed to call the backend with its cookie (CORS, #27).
app.cors.allowed-origin=http://localhost:${FRONTEND_PORT:5173}

# Seeding (#25, #26): the config file SeedLoader reads at startup, and what it does with the saved data.
# SEED_MODE comes from .env or the environment: keep (the default) only seeds an empty database,
# reset wipes everything and seeds again from the file.
app.seed.file=classpath:seed-config.json
app.seed.mode=${SEED_MODE:keep}
